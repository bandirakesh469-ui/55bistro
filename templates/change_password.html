<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change Password</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><div class="login"><img src="{{url_for('static',filename='img/logo.png')}}"><h1>Change Password</h1>{% with m=get_flashed_messages(with_categories=true) %}{% for c,x in m %}<div class="flash {{c}}">{{x}}</div>{% endfor %}{% endwith %}<form method="post"><input name="old_password" type="password" placeholder="Current password" required><input name="new_password" type="password" placeholder="New password" required><input name="confirm_password" type="password" placeholder="Confirm password" required><button class="btn">Update Password</button></form><a href="{{url_for('admin_dashboard')}}">Back to Dashboard</a></div></body></html>
